name: ChatterCashNative
options:
  bundleIdPrefix: app.chattercash
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    PRODUCT_BUNDLE_IDENTIFIER: app.chattercash.ios
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ChatterCash:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ChatterCash
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "Микрофон нужен для мгновенной записи расходов голосом."
        NSSpeechRecognitionUsageDescription: "Распознавание речи нужно для перевода голосовых фраз в категории трат."
        CFBundleURLTypes:
          - CFBundleURLName: app.chattercash.voice
            CFBundleURLSchemes:
              - chattercash
